name: Benchmark regression
description: Report a reproducible metric regression
title: "[Benchmark]: "
labels: ["type:benchmark", "status:triage"]
body:
  - type: input
    id: protocol
    attributes:
      label: Protocol and corpus version
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Baseline and candidate versions
    validations:
      required: true
  - type: textarea
    id: subgroup
    attributes:
      label: Affected condition/device/symbology subgroup
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Metric, denominator, uncertainty, and reproducible command
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: The report contains no image, crop, barcode value, product identity, or personal data.
          required: true

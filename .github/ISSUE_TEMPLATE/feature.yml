name: Feature proposal
description: Propose a scoped change with evidence and a falsifiable outcome
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered, including status quo
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Measurable success and stop criteria
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: The proposal does not silently add formats, platforms, cloud processing, health claims, or telemetry.
          required: true
